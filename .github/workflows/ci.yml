name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  ci-excel:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://powerlifting:powerlifting@localhost:5432/powerlifting
      NEXTAUTH_SECRET: test-secret
      TOKEN_ENCRYPTION_KEY_BASE64: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      EXCEL_PROXY_PATH: ./Kev Ultimate Comeback.xlsx
      DATA_BACKEND: excel
      PARITY_REQUIRED: false
      PARITY_ARTIFACT_PATH: parity-report-excel.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Start Postgres
        run: docker compose up -d postgres

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @powerlifting/web

      - name: Sync Prisma schema
        run: npm run prisma:push --workspace @powerlifting/web

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Runtime smoke (Excel API)
        run: |
          npm run build --workspace @powerlifting/web
          npm run start --workspace @powerlifting/web > /tmp/web.log 2>&1 &
          WEB_PID=$!
          cleanup() {
            kill $WEB_PID >/dev/null 2>&1 || true
            wait $WEB_PID >/dev/null 2>&1 || true
            echo "=== Web server logs ==="
            cat /tmp/web.log || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:3000/ >/dev/null; then
              break
            fi
            sleep 2
          done

          CSRF_TOKEN=$(
            curl -sf -c /tmp/auth-cookies.txt http://localhost:3000/api/auth/csrf |
              node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).csrfToken));"
          )

          curl -s -o /tmp/auth-signin-response.txt -w "%{http_code}" \
            -b /tmp/auth-cookies.txt -c /tmp/auth-cookies.txt \
            -X POST http://localhost:3000/api/auth/callback/credentials \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "csrfToken=${CSRF_TOKEN}" \
            --data-urlencode "callbackUrl=http://localhost:3000/dashboard" \
            --data-urlencode "json=true" >/dev/null

          curl -sf -b /tmp/auth-cookies.txt http://localhost:3000/api/dashboard/initial >/dev/null
          curl -sf -b /tmp/auth-cookies.txt http://localhost:3000/api/dashboard/blocks >/dev/null
          curl -sf -b /tmp/auth-cookies.txt http://localhost:3000/api/dashboard/block/Block%205 >/dev/null

      - name: Parity baseline
        run: npm run parity --workspace @powerlifting/data

      - name: Upload parity baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-baseline
          path: packages/data/parity-report-excel.json
          if-no-files-found: ignore

  ci-e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: ci-excel
    env:
      NEXTAUTH_SECRET: test-secret
      TOKEN_ENCRYPTION_KEY_BASE64: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      EXCEL_PROXY_PATH: ./Kev Ultimate Comeback.xlsx
      DATA_BACKEND: excel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e --workspace @powerlifting/web

  ci-google-parity:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DATA_BACKEND: google
      PARITY_REQUIRED: true
      PARITY_ARTIFACT_PATH: parity-report-google.json
      PARITY_SPREADSHEET_ID: ${{ secrets.PARITY_SPREADSHEET_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      WORKBOOK_PATH: ./Kev Ultimate Comeback.xlsx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Google parity
        run: npm run parity --workspace @powerlifting/data

      - name: Upload Google parity artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-google
          path: packages/data/parity-report-google.json
          if-no-files-found: ignore
