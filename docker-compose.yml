services:
  postgres:
    image: postgres:16-alpine
    container_name: powerlifting-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: powerlifting
      POSTGRES_PASSWORD: powerlifting
      POSTGRES_DB: powerlifting
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U powerlifting -d powerlifting']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
